# Njia CI
#
# WHY THIS DOES NOT LOOK LIKE THE NODE.JS STARTER WORKFLOW.
#
# It was the starter workflow, and it failed on its first run twelve seconds
# in. That template assumes a project shape Njia deliberately does not have:
#
#   cache: 'npm'   needs a package-lock.json — there is none, and setup-node
#                  errors out before a single step runs
#   npm ci         needs package.json + a lockfile — neither exists
#   npm run build  there is nothing to build; netlify.toml runs an echo
#   npm test       no package.json, so no test script to find
#
# Njia is a buildless, zero-dependency vanilla HTML/CSS/JS PWA. Netlify serves
# the committed files as they are. The test suite is node:test with no
# dependencies at all, so CI needs Node and a checkout and nothing else — no
# install step, no cache, no lockfile.
#
# WHAT IT CHECKS, AND WHY THE SECOND JOB EXISTS.
#
# 1. The unit suite. 270 tests, zero dependencies, runs in about a second.
#
# 2. Artefact freshness — that the committed generated files still match what
#    the generators produce from the current data. Njia commits its own build
#    output (55 static pages, a CSV export, a JSON export, the sitemap and
#    the structured data), so data/courses.js can change while the pages that
#    describe it do not, and nothing about the site looks wrong until a reader
#    downloads a CSV carrying last month's fees.
#
#    The local suite guards this with FILE MTIMES, which works on a working
#    copy and is useless in CI: git sets every mtime to checkout time in its
#    own order, so the guards fire on a clean tree. This job compares CONTENT
#    instead — regenerate, then `git diff --exit-code`. Same protection, no
#    false positive, and it is the check that would have caught the two real
#    staleness bugs this repo has had.
#
# WHY NODE 20 AND 22 AND NOT 18.
#
# Node 18 reached end of life in April 2025. Testing against an unsupported
# runtime buys a green tick and no safety.
#
# WHY THE BROWSER LAYERS ARE NOT HERE.
#
# tests/functional-probe.mjs and tests/a11y-sweep.mjs need Playwright and a
# Chromium, and they are the layers that actually find defects — the probe
# caught a help page throwing while 214 unit tests passed. They are absent
# because they were not verifiable from the environment this file was written
# in, and a job that cannot be checked before it ships is how CI ends up red
# and ignored. Add them deliberately, with a run you have watched go green.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Manually runnable. Without this there is no way to re-run CI against a ref
  # on demand, which is exactly what was needed when every run began reporting
  # startup_failure with no job and no log to read.
  workflow_dispatch:

jobs:
  test:
    name: Unit suite and artefact freshness
    runs-on: ubuntu-latest

    steps:
      # NO `uses:` ANYWHERE IN THIS FILE. THAT IS THE POINT.
      #
      # Every run from 19 August onward reported startup_failure with zero jobs
      # and no log — GitHub created the run and then failed to compile the
      # workflow. The YAML was byte-identical to the last green run and the repo
      # is public, so neither syntax nor exhausted minutes explains it. The
      # remaining compile-time failure that fits is an Actions policy that stops
      # resolving `uses:` — "allow select actions" without actions/checkout and
      # actions/setup-node on the list will fail exactly this way.
      #
      # Reading or changing that setting needs an API path this build
      # environment blocks on purpose, so the workflow is written to not need
      # it. A checkout is a git clone and Node is already on the runner image,
      # which is the whole dependency list for a buildless, zero-dependency
      # repo. If the policy is later reopened, this still works.
      - name: Check out the commit under test
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          # GITHUB_SHA is the merge commit on pull_request and the pushed commit
          # on push. Both are fetchable by sha, so one line covers both events.
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Report the runtime
        run: node --version

      # The Node version matrix is gone with actions/setup-node. It tested 20
      # and 22; the runner image ships a current LTS, and a suite that runs is
      # worth more than a matrix that does not compile. Restore the matrix the
      # day `uses:` resolves again.
      - name: Run the test suite
        run: node --test tests/*.test.js

      - name: Regenerate everything the repo commits
        run: |
          # The sitemap stamps <lastmod> with the build date, so a plain
          # regeneration would always differ by that one field. NJIA_BUILD_DATE
          # exists for exactly this: pin it to the date already committed, so
          # the diff shows real drift and nothing else.
          LASTMOD=$(grep -m1 '<lastmod>' sitemap.xml | sed 's/.*<lastmod>\(.*\)<\/lastmod>.*/\1/')
          echo "Pinning build date to committed lastmod: $LASTMOD"

          # Order matters. build-structured-data.mjs injects JSON-LD into pages
          # that build-open-data.mjs and build-provision-analysis.mjs own, so it
          # must run last or its blocks are overwritten.
          node tools/build-landing-stats.mjs
          node tools/build-open-data.mjs
          node tools/build-provision-analysis.mjs
          NJIA_BUILD_DATE="$LASTMOD" node tools/build-static-pages.mjs
          node tools/build-structured-data.mjs

      # The icons, favicon.ico and share card are NOT regenerated here: those
      # generators rasterise through Playwright, and a browser is a much larger
      # dependency than this check is worth. tests/artefacts.test.js already
      # fails if they fall behind icons/logo-mark.svg.

      - name: Fail if the committed output has drifted from the data
        run: |
          if ! git diff --exit-code --stat; then
            echo ""
            echo "::error::Committed generated files do not match the current data."
            echo "Someone changed data/ or a generator without re-running the build."
            echo "Fix locally, in this order, and commit the result:"
            echo "  node tools/build-landing-stats.mjs"
            echo "  node tools/build-open-data.mjs"
            echo "  node tools/build-provision-analysis.mjs"
            echo "  node tools/build-static-pages.mjs"
            echo "  node tools/build-structured-data.mjs   # last — it injects into the others"
            exit 1
          fi
