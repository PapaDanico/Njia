<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" role="img" aria-label="Njia">
  <!-- The Njia mark, drawn to the supplied brand sheet: a pointed vertical
       shield divided into terracotta, ochre gold and earth brown fields,
       with a cream road winding up through it and straightening into an
       arrow.

       Redrawn as vector rather than cropped from the sheet so it stays sharp
       from a 16px browser tab to a 512px app icon, and so the fields can be
       recoloured for the dark variant without a second file. The colours are
       the brand hexes exactly, not approximations. -->
  <defs>
    <clipPath id="njia-shield">
      <path d="M32 4C46 22 58 36 58 50c0 16-12 32-26 42C18 82 6 66 6 50 6 36 18 22 32 4Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#njia-shield)">
    <!-- Terracotta ground -->
    <rect width="64" height="96" fill="#8B2500"/>
    <!-- Earth brown lower field, on the diagonal the sheet shows -->
    <path d="M0 54 64 68V96H0Z" fill="#3D1C02"/>
    <!-- Ochre gold wedge on the right shoulder -->
    <path d="M33 52 64 40v25Z" fill="#C8860A"/>
  </g>

  <g clip-path="url(#njia-shield)">
    <!-- The road: winds up from the foot of the shield, then straightens. -->
    <path d="M25 90c-2-9 9-12 10-21 1-8-7-11-6-19 1-6 3-8 3-11" fill="none"
          stroke="#F5E9D4" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Dashed centre line, as on the sheet. -->
    <path d="M25 90c-2-9 9-12 10-21 1-8-7-11-6-19 1-6 3-8 3-11" fill="none"
          stroke="#3D1C02" stroke-width="1" stroke-linecap="round"
          stroke-dasharray="2.5 4" opacity=".5"/>
  </g>

  <!-- The arrow the road becomes: straight shaft, open head. -->
  <path d="M32 41V17" fill="none" stroke="#F5E9D4" stroke-width="6" stroke-linecap="round"/>
  <path d="m24.5 25 7.5-8.5 7.5 8.5" fill="none" stroke="#F5E9D4" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Shield outline, drawn last so it sits over every field edge. -->
  <path d="M32 4C46 22 58 36 58 50c0 16-12 32-26 42C18 82 6 66 6 50 6 36 18 22 32 4Z"
        fill="none" stroke="var(--mark-edge, #3D1C02)" stroke-width="4.5" stroke-linejoin="round"/>
</svg>
