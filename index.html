  <script>
    // Stamp the theme before first paint so a dark-preference load never
    // flashes light. Kept inline and tiny on purpose; the full theme
    // manager (toggle, persistence, meta sync) lives in js/app.js.
    (function () {
      try {
        var t = localStorage.getItem('njia-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { /* default light */ }
    })();
  </script>
  <!-- Content Security Policy.
       Be precise about what this buys. The app uses inline onclick handlers
       throughout and a pre-paint theme script, so script-src needs
       'unsafe-inline' — meaning this CSP does NOT make the app immune to
       injected script. What it does enforce is origin restriction, and for
       Njia that is the load-bearing part: connect-src 'self' means user
       answers, saved courses and plans cannot be sent to any third party,
       which is the privacy promise the product actually makes. default-src
       'self' blocks external scripts, styles, fonts and trackers outright.
       Removing 'unsafe-inline' would require replacing every inline handler
       with addEventListener — worth doing, and tracked in the upgrade plan. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">

  <script>
    function openAboutModal() {
      openModal(`
        <h3 class="mb-2">About Njia</h3>
        <p class="text-secondary text-sm mb-2"><strong>The problem.</strong> Nearly a million Kenyan youth sit the KCSE every year — 993,226 in 2025. Only around 30% get placed into a course through KUCCPS. Youth unemployment is reported anywhere between about 15% and 67% depending on the age band and on whether you count only people actively job-hunting or everyone without adequate work. Most of that isn't a shortage of options; it's a shortage of a clear, personal way to match real strengths and constraints to a real pathway — degree, diploma, TVET, or certificate.</p>
        <p class="text-secondary text-sm mb-2"><strong>What Njia is.</strong> A free, five-module diagnostic — Discover, Design, Decide, Connect, Track — that fuses career psychology, life-design methods and strategic life-portfolio planning into one tool, then checks the result against real Kenyan course fees, grade requirements and funding sources. No account, no cost, works offline once loaded.</p>
        <p class="text-secondary text-sm mb-2"><strong>Who's behind it.</strong> Njia is an independently built, early-stage project — not backed by any institution, government body, or funder (see Products &amp; Partners). That's also why it's honest about which data is illustrative and which is verified: there's no sponsor to please, only the person using it.</p>
        <p class="text-secondary text-sm mb-2"><strong>What we won't do.</strong> Charge for the core diagnostic, sell your data (we don't have it — see Privacy), or claim certainty the data doesn't support.</p>
        <p class="text-secondary text-sm mb-2">Want the full research basis? See Methodology. Want to help make the data real? See Products &amp; Partners.</p>
        <div class="btn-row mb-2">
          <button type="button" class="btn btn-secondary btn-sm" onclick="openMethodologyModal()">Methodology</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="openPartnersModal()">Partners</button>
        </div>
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Close</button>
      `);
    }
    function openPrivacyModal() {
      openModal(`
        <h3 class="mb-2">Your Data & Privacy</h3>
        <p class="text-secondary text-sm mb-2">Everything you enter in Njia — questionnaire answers, plans, saved courses, OKRs — stays on this device in your browser's local storage. None of it is sent to a server or shared with anyone.</p>
        <p class="text-secondary text-sm mb-2"><strong>The only thing you type that ever leaves:</strong> if you choose to submit the optional Feedback or Partner Inquiry form, whatever you type into that form is sent to us — that's the only data that ever leaves your device, and only if you actively submit it.</p>
        <p class="text-secondary text-sm mb-2">Njia doesn't use cookies, trackers, or any third-party analytics — no Google, no Facebook, nothing from outside this app is loaded or told anything about you.</p>
        <!-- This paragraph used to read "no analytics of any kind — nothing
             running in the background collecting behaviour data". That stopped
             being true the moment milestone counting shipped, and a promise
             nobody updated is worse than one that was never made. The rule this
             project applies to fee figures applies to its own claims. -->
        <p class="text-secondary text-sm mb-2"><strong>The one thing Njia does count.</strong> When someone finishes the questionnaire, saves a course, starts an application or downloads a report, Njia asks its own server for a small file named after that step. All that gets recorded is that the step happened — <em>once more than yesterday</em>. Nothing about you goes with it: no name, no device or session number, no answers, not even which course. Two steps from you look exactly like one step from two different people, so there is no trail back to anybody. It is the same kind of record any website keeps of a page being opened.</p>
        <p class="text-secondary text-sm mb-2">Why at all: without knowing how many young people actually reach the end, Njia cannot be funded or taken up by a school, and it goes out of date. If your browser sends "Do Not Track" or Global Privacy Control, Njia counts nothing. Offline, it counts nothing either.</p>
        <p class="text-secondary text-sm mb-2">Switching phones? Export a backup below and import it on the new device — nothing here syncs automatically.</p>
        <div class="btn-row mb-2">
          <button type="button" class="btn btn-secondary" onclick="exportMyData()">⬇ Export Backup</button>
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('import-file-input').click()">⬆ Import Backup</button>
        </div>
        <input type="file" id="import-file-input" accept="application/json" class="hidden" onchange="importMyData(this.files[0])">
        <p class="text-secondary text-sm mb-2">If you're using a shared or borrowed phone, use "Clear My Data" below before handing it back — it wipes everything Njia stored on this device. It can't do anything about a Feedback or Partner Inquiry you already submitted, since that already left the device.</p>
        <button type="button" class="btn btn-danger" onclick="confirmClearAllData()">Clear My Data</button>
      `);
    }
    function exportMyData() {
      const blob = new Blob([JSON.stringify(AppState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `njia-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Backup downloaded.', 'success');
    }
    function importMyData(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let parsed;
        try {
          parsed = JSON.parse(reader.result);
        } catch (err) {
          showToast('That file is not a valid Njia backup.', 'error');
          return;
        }
        if (typeof parsed !== 'object' || parsed === null || !('questionnaire' in parsed)) {
          showToast('That file does not look like a Njia backup.', 'error');
          return;
        }
        AppState = Object.assign(defaultState(), parsed);
        saveState();
        closeModal();
        showToast('Backup restored.', 'success');
        navigateTo('home');
      };
      reader.onerror = () => showToast('Could not read that file.', 'error');
      reader.readAsText(file);
    }
    function confirmClearAllData() {
      openModal(`
        <h3 class="mb-2">Clear all Njia data?</h3>
        <p class="text-secondary mb-3">This permanently deletes your Discovery results, Odyssey Plans, saved courses, OKRs and applications from this device. This cannot be undone.</p>
        <div class="btn-row">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="button" class="btn btn-danger" onclick="clearAllDataConfirmed()">Delete Everything</button>
        </div>
      `);
    }
    function clearAllDataConfirmed() {
      resetState();
      closeModal();
      showToast('All data cleared.', 'success');
      navigateTo('home');
    }
    function openMethodologyModal() {
      openModal(`
        <h3 class="mb-2">The Njia Method &amp; Data Sources</h3>
        <p class="text-secondary text-sm mb-2"><strong>Career Psychology (Four Elements).</strong> Scores your Identity (strengths), Community (ideal environment), Necessity (real constraints) and Horizon (long-term vision) — a model refined through decades of executive coaching research into what actually predicts career fit.</p>
        <p class="text-secondary text-sm mb-2"><strong>Life Design (Odyssey Planning).</strong> Rather than forcing one linear plan, you sketch three: the path you're already on, the path you'd take if it disappeared, and the path you'd take if money were no object. Committing too early is a leading cause of career regret — prototyping multiple futures first is how design strategists avoid it.</p>
        <p class="text-secondary text-sm mb-2"><strong>Strategic Life Portfolio.</strong> The same rigour used in corporate strategy, applied to a life: auditing how your time and energy actually split across health, work, play and relationships, then making deliberate trade-offs instead of drifting.</p>
        <p class="text-secondary text-sm mb-2"><strong>Landing page statistics</strong> (KCSE candidates, KUCCPS placement rate, youth unemployment) are cited to KUCCPS, the Ministry of Education, and a World Bank/ILO modeled estimate — see the footer for full citations.</p>
        <p class="text-secondary text-sm mb-2"><strong>In-app course, fee and funding data</strong> (Decide module) is mostly illustrative for this MVP — institution names are real, but fees, employment rates and salaries are estimates not yet verified against live TVETA/CUE/KNBS sources. A handful of records (marked "✓ Verified estimate") have been cross-checked against a public source (e.g. HELB's 2025/26 funding model, published KMTC and university fee ranges) and carry a citation — but even those are ranges or mid-estimates, not an institution's exact published figure. Always confirm directly before deciding.</p>
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Close</button>
      `);
    }
    function openTermsModal() {
      openModal(`
        <h3 class="mb-2">Terms of Use</h3>
        <p class="text-secondary text-sm mb-2">Njia is provided free, "as is", for informational and educational purposes only. It is not professional career counselling, financial, or legal advice — always verify institution accreditation, fees and funding details directly with the relevant institution or authority before making a decision.</p>
        <p class="text-secondary text-sm mb-2">Njia is an independent project. It is not affiliated with, endorsed by, or sponsored by any institution, funder, or organisation named or listed in the app — those names are used solely to describe real, publicly available institutions or public information.</p>
        <p class="text-secondary text-sm mb-2">All your data (questionnaire answers, plans, saved courses, OKRs, applications) is stored only in this browser's local storage on your device. No account is required and Njia does not collect or receive your data on any server — the sole exception is the optional Feedback and Partner Inquiry forms, which are only sent to us if you actively submit them.</p>
        <p class="text-secondary text-sm mb-2">Course, institution and funding data bundled in this version is illustrative pending verification (see Methodology) and may contain errors. You are responsible for verifying information and for decisions made using this tool. Njia is provided without warranty of any kind, and content may change or be discontinued at any time.</p>
        <p class="text-secondary text-sm mb-2">If you are under 18, we encourage you to involve a parent or guardian in decisions about your education and finances — Njia is a research tool, not a substitute for that conversation.</p>
        <p class="text-secondary text-sm mb-2">These terms are governed by the laws of Kenya. We may update these terms as Njia develops; continued use after a change means you accept the update. Questions or concerns — use "Give Feedback" in the footer.</p>
        <p class="text-secondary text-sm mb-2">By using Njia, you agree to these terms.</p>
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Close</button>
      `);
    }
    function openPartnersModal() {
      openModal(`
        <h3 class="mb-2">Products &amp; Partners</h3>
        <!-- This said "Njia is currently one free product suite", which stopped
             being true. Two sister tools exist and are named here rather than
             left for a reader to stumble on: a handoff a product will not admit
             to is the kind of thing that looks like a placement when someone
             finds it. Neither pays us and neither is a partner in the sense the
             paragraph below means. -->
        <p class="text-secondary text-sm mb-2"><strong>Products.</strong> Njia is five free modules — Discover, Design, Decide, Connect, Track — covering career diagnosis, life design, course and funding matching, outreach, and follow-through. All run client-side, with no account or backend required.</p>
        <p class="text-secondary text-sm mb-2"><strong>Sister tools.</strong> The same people build two other free tools, and Njia links to one of them where it runs out of things it can honestly say. <a href="https://jipangefinance.org/" target="_blank" rel="noopener noreferrer">JiPange</a> covers household money — budgeting, debt and savings goals — which is where the Decide module's funding gap actually gets settled. <a href="https://mwangazayield.org/" target="_blank" rel="noopener noreferrer">Mwangaza Yield</a> covers Kenyan government bonds. Both are free, neither takes an account, and no money moves between any of them.</p>
        <p class="text-secondary text-sm mb-2"><strong>Partners.</strong> Njia does not yet have any formal institutional, government, or NGO partners — this is an independently built, early-stage project. Institution names shown in the Decide module are included because they are real, publicly known Kenyan institutions, not because of any partnership or endorsement.</p>
        <p class="text-secondary text-sm mb-2">Looking ahead, the kind of partnerships that would most improve Njia are: accredited institutions willing to share verified fee/outcome data, funders (HELB, county bursary offices, foundations) for direct integration, and youth or community organisations for real mentor matching.</p>
        <button type="button" class="btn btn-primary mb-2" onclick="openPartnerInquiryModal()"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg> Partner With Us</button>
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Close</button>
      `);
    }
    function openPartnerInquiryModal() {
      openModal(`
        <h3 class="mb-2">Partner With Us</h3>
        <p class="text-secondary text-sm mb-2">Institution, funder, NGO, government body, or employer — tell us a bit about what you have in mind. No commitment, just a starting conversation. Submitting sends these details to us — unlike the rest of Njia, this form isn't private, since you're asking us to contact you back.</p>
        <label class="caption" for="partner-org">Organisation name</label>
        <input type="text" id="partner-org" class="form-control" placeholder="e.g. Equity Group Foundation" style="width:100%;margin:0.4rem 0 0.8rem">
        <label class="caption" for="partner-contact">Your name</label>
        <input type="text" id="partner-contact" class="form-control" placeholder="Your name" style="width:100%;margin:0.4rem 0 0.8rem">
        <label class="caption" for="partner-email">Email</label>
        <input type="email" id="partner-email" class="form-control" placeholder="you@organisation.org" style="width:100%;margin:0.4rem 0 0.8rem">
        <label class="caption" for="partner-type">Type of partnership</label>
        <select id="partner-type" class="form-control" style="width:100%;margin:0.4rem 0 0.8rem">
          <option value="institution">Accredited institution (data sharing)</option>
          <option value="funder">Funder / bursary / scholarship body</option>
          <option value="government">Government / county body</option>
          <option value="ngo">NGO / youth organisation</option>
          <option value="employer">Employer</option>
          <option value="other">Other</option>
        </select>
        <label class="caption" for="partner-message">Message</label>
        <textarea class="q-input mt-1" id="partner-message" placeholder="What did you have in mind?"></textarea>
        <button type="button" class="btn btn-primary mt-2" onclick="submitPartnerInquiry()">Send Inquiry</button>
      `);
    }
    function submitPartnerInquiry() {
      const org = document.getElementById('partner-org')?.value.trim();
      const contact = document.getElementById('partner-contact')?.value.trim();
      const email = document.getElementById('partner-email')?.value.trim();
      const type = document.getElementById('partner-type')?.value;
      const message = document.getElementById('partner-message')?.value.trim();
      if (!org || !contact || !email || !message) {
        showToast('Please fill in organisation, name, email and a short message.', 'error');
        return;
      }
      const body = new URLSearchParams({
        'form-name': 'njia-partner-inquiry',
        organisation: org,
        contact,
        email,
        type,
        message
      }).toString();
      fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body })
        .then((res) => {
          if (!res.ok) throw new Error('form rejected: ' + res.status);
          showToast('Thanks — we\'ll be in touch.', 'success');
        })
        .catch(() => showToast('Could not send — check your connection and try again.', 'error'));
      closeModal();
    }
    function openFaqModal() {
      openModal(`
        <h3 class="mb-2">Frequently Asked Questions</h3>
        <p class="text-secondary text-sm mb-2"><strong>Is Njia really free?</strong><br>Yes — completely free, no signup, no ads, no paywall.</p>
        <p class="text-secondary text-sm mb-2"><strong>Does my data leave my phone?</strong><br>No — your questionnaire answers, plans, saved courses and OKRs stay in your browser's local storage on your device only. The one exception is if you choose to submit the optional Feedback or Partner Inquiry form; whatever you type there is sent to us, and only then.</p>
        <p class="text-secondary text-sm mb-2"><strong>Do I need internet to use it?</strong><br>Only for your first visit. After that, Njia works fully offline.</p>
        <p class="text-secondary text-sm mb-2"><strong>Is the course and fee data accurate?</strong><br>Institution names are real, but fees, employment rates and salaries are illustrative estimates for this early version — always confirm directly with the institution before deciding. See Methodology.</p>
        <p class="text-secondary text-sm mb-2"><strong>Is Njia affiliated with KUCCPS, HELB, or any institution?</strong><br>No. Njia is an independent, early-stage project — institution and funder names appear because they're real, publicly known Kenyan bodies, not because of any partnership or endorsement. See About Njia.</p>
        <p class="text-secondary text-sm mb-2"><strong>What if my KCSE grade is not great?</strong><br>Discover and the Course Matcher are built around this — they surface certificate, artisan and TVET pathways too, not just university degrees, and adapt to your actual grade and budget. Set your real grade in the Course Matcher filters: guessing high hides the courses you can actually get into.</p>
        <p class="text-secondary text-sm mb-2"><strong>I got an E. Is there anything for me?</strong><br>Yes — the artisan route. KUCCPS sets the minimum for an Artisan certificate (KNQF Level 4) at a mean grade of E, and opens Level 4 to everyone who scored C down to E. It runs about a year, and it is the entry point for the building and mechanical trades: masonry, carpentry and joinery, plumbing, electrical installation, motor vehicle mechanics, welding and fabrication, painting and decoration, refrigeration, hairdressing and beauty, food and beverage, and computer repair. Filter the Course Matcher to <strong>Artisan</strong> to see them, at a national polytechnic in Nairobi and at a county vocational training centre in Samburu. From there you can ladder up to a Craft certificate (Level 5) and then a Diploma (Level 6) without going back to Form Four. Some centres publish no fee structure at all; where that is true Njia says <strong>Not published</strong> rather than showing a guessed number, and you should ring the centre for the fee per term, what county capitation covers, and whether tools and the NITA trade-test fee are charged separately.</p>
        <p class="text-secondary text-sm mb-2"><strong>I never sat KCSE, or I left before Form Four. Is anything open to me?</strong><br>Yes, but not through KUCCPS — its artisan minimum still assumes a KCSE grade of E. Faith-based and mission training centres are the route that does not. Five are in the Course Matcher — filter to <strong>Artisan</strong>. Christian Industrial Training Centre (Anglican Church of Kenya) admits to its KNEC artisan certificates on a <strong>KCPE certificate</strong>, at Pumwani and in Mombasa. YMCA's National Training Institute at Shauri Moyo, running since 1966, takes KCPE holders, KCSE D- and below, and anyone who left before Form Four. St. Kizito in Githurai, founded on Cardinal Otunga's initiative, teaches primary school leavers alongside secondary ones. Don Bosco Boys Technical Training Centre in Karen admits by interview and boards its trainees, though it takes <strong>boys only</strong>. None of them publishes a fee structure, so ring and ask what is charged and what is sponsored.</p>
        <p class="text-secondary text-sm mb-2"><strong>Is a trade actually worth it, or should I retake?</strong><br>Look at the numbers before you assume. Kenya has roughly 5,000 engineers and architects but fewer than 2,000 trained plumbers, painters and masons between them, and two-thirds of developers name skilled-worker shortage as the main brake on building. Certified artisans are reported at Ksh 2,500–3,000 a day, which compares well with what many diploma and degree holders start on. Two honest cautions: that is a day rate, not a salary — work is irregular and seasonal, with no employer pension, paid leave or sick pay — and it is the rate for <em>certified</em> artisans. Uncertified work pays a fraction of it, which is the whole argument for doing the certificate rather than just picking up the tools.</p>
        <p class="text-secondary text-sm mb-2"><strong>How is this different from a personality quiz?</strong><br>It's built on three research-backed methodologies — career psychology, life design and strategic life-portfolio planning (see Methodology) — and every recommendation is checked against real Kenyan grade requirements, fees and funding, not just a personality label.</p>
        <p class="text-secondary text-sm mb-2"><strong>Can I use this on a shared or borrowed phone?</strong><br>Yes — use "Clear My Data" (lock icon in the header) before handing the phone back.</p>
        <p class="text-secondary text-sm mb-2"><strong>What happens if I uninstall Njia or clear my browser data?</strong><br>It's gone for good — since everything lives in this browser's local storage, uninstalling or clearing site data deletes it permanently. Export a backup first if you want to keep it (see Privacy &amp; your data).</p>
        <p class="text-secondary text-sm mb-2"><strong>Can I use Njia if I'm not in Kenya?</strong><br>You can, but the course, fee and funding data is Kenya-specific — it won't be useful for education decisions outside Kenya's system.</p>
        <p class="text-secondary text-sm mb-2"><strong>I found a data error — how do I report it?</strong><br>Use "Give Feedback" in the footer and describe what looks wrong. Course, fee and funding data is illustrative pending verification, and reports help decide what to verify next.</p>
        <p class="text-secondary text-sm mb-2"><strong>Can I retake the questionnaire?</strong><br>Yes, any time, from the results screen.</p>
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Close</button>
      `);
    }
    function openFeedbackModal() {
      openModal(`
        <h3 class="mb-2">Quick feedback</h3>
        <p class="text-secondary text-sm mb-2">Optional and anonymous — helps improve Njia. No reply, no account needed. Submitting sends your rating and comment to us; it's the only thing that ever leaves your device.</p>
        <div class="btn-row mb-2">
          <button type="button" class="btn btn-secondary" id="feedback-up" onclick="selectFeedbackRating('up')">👍 Helpful</button>
          <button type="button" class="btn btn-secondary" id="feedback-down" onclick="selectFeedbackRating('down')">👎 Not helpful</button>
        </div>
        <textarea class="q-input" id="feedback-comment" placeholder="Anything specific? (optional)"></textarea>
        <button type="button" class="btn btn-primary mt-2" onclick="submitFeedback()">Send Feedback</button>
      `);
    }
    let selectedFeedbackRating = null;
    function selectFeedbackRating(rating) {
      selectedFeedbackRating = rating;
      document.getElementById('feedback-up')?.classList.toggle('btn-primary', rating === 'up');
      document.getElementById('feedback-up')?.classList.toggle('btn-secondary', rating !== 'up');
      document.getElementById('feedback-down')?.classList.toggle('btn-primary', rating === 'down');
      document.getElementById('feedback-down')?.classList.toggle('btn-secondary', rating !== 'down');
    }
    function submitFeedback() {
      const comment = document.getElementById('feedback-comment')?.value.trim() || '';
      if (!selectedFeedbackRating && !comment) {
        showToast('Pick a rating or add a comment first.', 'error');
        return;
      }
      const body = new URLSearchParams({
        'form-name': 'njia-feedback',
        rating: selectedFeedbackRating || 'none',
        page: AppState.currentPage,
        comment
      }).toString();
      fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body })
        .then((res) => {
          if (!res.ok) throw new Error('form rejected: ' + res.status);
          showToast('Thanks for the feedback!', 'success');
        })
        .catch(() => showToast('Could not send feedback — check your connection.', 'error'));
      selectedFeedbackRating = null;
      closeModal();
    }
  </script>
